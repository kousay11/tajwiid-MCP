[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wirdi-mcp"
version = "0.6.0"
license = "MIT"
license-files = ["LICENSE", "src/wirdi_mcp/quran/snapshot/LICENSE-DATA.md", "src/wirdi_mcp/quran/snapshot/NOTICE.md"]
description = "Local-first, evidence-first Qaloun MCP with candidate Tajwid detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "hatchling>=1.27,<2", "jsonschema>=4.20,<5"]

[project.scripts]
wirdi-mcp = "wirdi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wirdi_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
# the bundled snapshot is pinned byte for byte: tools must never rewrite it
extend-exclude = [".verification", "src/wirdi_mcp/quran/snapshot"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
